## IDF Component Manager Manifest File
## Trimmed to the components this e-paper firmware actually uses.
## The upstream xiaozhi multi-board manifest carried ~40 panel/touch/camera/
## P4/C3 drivers that never appear in this build; they only slowed full
## rebuilds and enlarged the supply-chain surface. Re-add deliberately if a
## future board needs one of them.
dependencies:
  # Audio pipeline: opus codec + ES8311 via esp_codec_dev + wake-word types
  78/esp-opus-encoder: ~2.4.1
  espressif/esp_codec_dev: ~1.5
  espressif/esp-sr: ~2.2.0

  # Buttons (boards/common/button.cc uses button_gpio.h)
  espressif/button: ~4.1.3

  # LVGL: lcd_display.cc/lvgl_display base classes still compile against it
  lvgl/lvgl: ~9.3.0
  esp_lvgl_port: ~2.6.0

  # IDF 6.0 compatibility: these were built-in before
  espressif/cjson: ^1
  espressif/mqtt: '*'

  ## Required IDF version
  idf:
    version: '>=5.4.0'
